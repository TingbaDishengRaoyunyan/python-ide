version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [private]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    networks: [private]
    volumes:
      - redis_data:/data

  api:
    build: { context: ../backend }
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp]
    environment:
      DATA_ROOT: /data
      WORKER_URL: http://worker:9000
      WORKER_TOKEN: ${WORKER_TOKEN}
      SESSION_SECRET: ${SESSION_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_AUTO_PROMOTE: ${ADMIN_AUTO_PROMOTE}
      PACKAGE_MIRROR_URL: ${PACKAGE_MIRROR_URL}
    volumes:
      - tenant_data:/data
    expose: ["8000"]
    depends_on: [postgres, redis, worker]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [private]

  worker:
    build: { context: ../worker }
    restart: unless-stopped
    environment:
      WORKER_TOKEN: ${WORKER_TOKEN}
    volumes:
      - tenant_data:/data
    expose: ["9000"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health')"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks: [private]

  frontend:
    build: { context: ../frontend }
    restart: unless-stopped
    expose: ["80"]
    depends_on: [api]
    networks: [private]

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [frontend]
    networks: [private]

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [private]

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
    expose: ["3000"]
    networks: [private]

volumes:
  postgres_data: {}
  redis_data: {}
  tenant_data: {}
  caddy_data: {}
  caddy_config: {}
  prometheus_data: {}
  grafana_data: {}

networks:
  private:
    driver: bridge
