apiVersion: v1
kind: ResourceQuota
metadata: {name: runner-quota, namespace: python-ide-runners}
spec:
  hard:
    pods: "50"
    requests.cpu: "20"
    requests.memory: 40Gi
    limits.cpu: "40"
    limits.memory: 80Gi
---
apiVersion: v1
kind: LimitRange
metadata: {name: runner-limits, namespace: python-ide-runners}
spec:
  limits:
    - type: Container
      default: {cpu: "1", memory: 2Gi}
      defaultRequest: {cpu: 250m, memory: 256Mi}
